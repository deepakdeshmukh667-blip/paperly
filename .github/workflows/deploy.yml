name: Deploy PAPERLY to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment
        run: |
          # Remove files not needed for static site deployment
          rm -rf node_modules .git .github scripts adapters migrations worker
          rm -f server.js wrangler.toml package-lock.json .wranglerignore
          rm -f GSD-STYLE.md PROJECT_RULES.md VERSION model_capabilities.yaml
          rm -f .users_db.json
          # Remove heavy library assets (served via CDN in production)
          rm -rf assets/library

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
