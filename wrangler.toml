name = "paperly"
main = "worker/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Assets binding for serving frontend static files
[assets]
directory = "./"
binding = "ASSETS"
# Exclude non-public files from asset upload
not_found_handling = "single-page-application"

# Cloudflare D1 Relational SQL Database
[[d1_databases]]
binding = "DB"
database_name = "paperly-d1"
database_id = "538f5e5d-8f05-4529-91bb-cb7e93a10508"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage (Private user photos & assets) - enable once created
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "paperly-uploads"

# Cloudflare KV (Session cache & temporary state)
[[kv_namespaces]]
binding = "KV_CACHE"
id = "4576a211e64e4f18ba30493d8c2c9a46"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
APP_NAME = "PAPERLY"
APP_URL = "https://paperly.workers.dev"
JWT_SECRET = "paperly-dev-secret-key-change-in-production-only"

